[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smartverifier-focus"
version = "0.1.0"
description = "Traceable, non-generative image crops for inspection agents"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.1.1,<13"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2", "httpx>=0.28.1,<1"]
lmstudio = [
    "lmstudio==1.5.0",
]
web = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "segno>=1.6,<2",
    "uvicorn>=0.34,<1",
    "opencv-python-headless>=4.13,<5",
    "psutil>=7,<8",
    "httpx>=0.28.1,<1",
]

[project.scripts]
image-focus = "smartverifier_focus.cli:main"
image-focus-mcp = "smartverifier_focus.server:main"
image-focus-compare = "smartverifier_focus.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartverifier_focus"]
